  # API officielle France Travail (gratuite). Identifiants : voir le README.
  france_travail:
    actif: true
    intervalle_minutes: 30
    mots_cles:
      - data scientist
      - machine learning
      - intelligence artificielle
      - biostatisticien
      - LLM
      - NLP
      - données de santé

  # Agrégateur Adzuna (gratuit, quota limité : garde un intervalle large).
  adzuna:
    actif: true
    intervalle_minutes: 180
    pays:
      fr: [data scientist, machine learning, intelligence artificielle, biostatisticien]
      ch: [data scientist, machine learning]
      gb: [data scientist, machine learning, biostatistician]
      ca: [data scientist, machine learning]
      us: [data scientist health, machine learning health]
      au: [data scientist, machine learning]
      nz: [data scientist]

  # Tes alertes emploi LinkedIn, lues dans ta boîte Gmail (lecture seule).
  # Le bot ne se connecte jamais à LinkedIn. Les emails ne donnent que le titre,
  # l'entreprise et le lieu : ces offres arrivent en « signalées », et le bot te
  # demande de coller le texte de l'offre avant d'écrire la lettre.
  linkedin_alertes:
    actif: true
    intervalle_minutes: 10
    dossier: INBOX
    expediteurs:
      - jobalerts-noreply@linkedin.com
      - jobs-noreply@linkedin.com
      - jobs-listings@linkedin.com

# ─────────────────────────── IA ───────────────────────────
ia:
  # « abonnement » : passe par Claude Code et ton abonnement Claude (pas de clé API,
  # mais consomme tes quotas). « api » : clé ANTHROPIC_API_KEY, facturée à l'usage.
  moteur: abonnement
  claude_code: claude           # commande ou chemin complet de Claude Code
  modele_tri: claude-opus-5-5
  effort_tri: low               # low suffit pour noter une offre
  modele_lettre: claude-opus-5-5
  effort_lettre: high

# ─────────────────────────── Envoi ───────────────────────────
envoi:
  # Si l'offre demande une candidature par email et que Gmail est configuré dans .env,
  # le bot envoie CV + lettre à cette adresse quand tu cliques sur ✅.
  # L'adresse est affichée dans le message Telegram avant ta validation.
  email_auto: true
