<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" width="1040" height="250" role="img"><title>Anatomie d'un appel à Claude : consignes stables et offre variable, envoyées avec un schéma JSON, puis contrôles dans le code avant l'enregistrement.</title><style>
svg{color:#1d2421;font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}
text{font-size:13px;fill:#1d2421}
.t-small{font-size:11.5px;fill:#5d6762}.t-mono{font-family:Menlo,'IBM Plex Mono',monospace;font-size:11.5px}.t-bold{font-weight:600}
.box{fill:#fff;stroke:#1d2421;stroke-width:1.2}.box-ai{fill:#e2efec;stroke:#0d6b5f;stroke-width:1.5}
.box-hu{fill:#f7ead9;stroke:#b25f00;stroke-width:1.5}.box-off{fill:none;stroke:#5d6762;stroke-width:1.2;stroke-dasharray:5 4}
.zone{fill:none;stroke:#c9cfcb;stroke-width:1.5;stroke-dasharray:6 5}
.edge{fill:none;stroke:#1d2421;stroke-width:1.3}.edge-ai{fill:none;stroke:#0d6b5f;stroke-width:1.6}
.edge-hu{fill:none;stroke:#b25f00;stroke-width:1.6}.edge-off{fill:none;stroke:#5d6762;stroke-width:1.3;stroke-dasharray:5 4}
.life{stroke:#c9cfcb;stroke-width:1.2;stroke-dasharray:3 4}
.ai-text{fill:#0d6b5f}.hu-text{fill:#b25f00}
.head{fill:#1d2421}.head-ai{fill:#0d6b5f}.head-hu{fill:#b25f00}.head-off{fill:#5d6762}
</style><rect x="0" y="0" width="1040" height="250" fill="#ffffff"/>
          <defs>
            <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
            <marker id="d-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-ai"/></marker>
          </defs>
          <rect x="20" y="30" width="260" height="96" rx="4" class="box"/>
          <text x="34" y="54" class="t-bold">Consignes système (stables)</text>
          <text x="34" y="74" class="t-small">règles de notation, fiche de faits,</text>
          <text x="34" y="91" class="t-small">préférences, guide de style</text>
          <text x="34" y="113" class="t-small ai-text">identiques d'un appel à l'autre : cache</text>
          <rect x="20" y="146" width="260" height="78" rx="4" class="box"/>
          <text x="34" y="170" class="t-bold">Message (variable)</text>
          <text x="34" y="190" class="t-small">l'offre, vos refus récents,</text>
          <text x="34" y="207" class="t-small">la lettre actuelle et votre consigne</text>
          <polyline points="282,78 316,78 316,124 340,124" class="edge" marker-end="url(#d)"/>
          <polyline points="282,185 316,185 316,140 340,140" class="edge" marker-end="url(#d)"/>

          <rect x="342" y="84" width="230" height="96" rx="4" class="box-ai"/>
          <text x="356" y="108" class="t-bold">Claude Code</text>
          <text x="356" y="128" class="t-mono">claude -p --model …</text>
          <text x="356" y="146" class="t-mono">--effort --json-schema</text>
          <text x="356" y="166" class="t-small">--tools "" : aucun outil</text>
          <line x1="574" y1="132" x2="618" y2="132" class="edge-ai" marker-end="url(#d-ai)"/>
          <text x="578" y="124" class="t-small ai-text">JSON</text>

          <rect x="620" y="60" width="230" height="144" rx="4" class="box"/>
          <text x="634" y="84" class="t-bold">Contrôles dans le code</text>
          <text x="634" y="106" class="t-small">note bornée entre 0 et 100</text>
          <text x="634" y="126" class="t-small">email gardé seulement s'il</text>
          <text x="634" y="143" class="t-small">figure mot pour mot dans l'offre</text>
          <text x="634" y="163" class="t-small">option de formulaire inventée :</text>
          <text x="634" y="180" class="t-small">laissée vide pour vous</text>
          <line x1="852" y1="132" x2="896" y2="132" class="edge" marker-end="url(#d)"/>
          <path d="M898 112 a62 10 0 0 1 124 0 v40 a62 10 0 0 1 -124 0 z" class="box"/>
          <path d="M898 112 a62 10 0 0 0 124 0" class="edge"/>
          <text x="960" y="140" text-anchor="middle" class="t-bold">SQLite</text>
        </svg>