          <rect x="190" y="16" width="120" height="40" rx="4" class="box"/><text x="250" y="41" text-anchor="middle" class="t-bold">Bot Telegram</text>
          <rect x="360" y="16" width="120" height="40" rx="4" class="box"/><text x="420" y="41" text-anchor="middle" class="t-bold">Pipeline</text>
          <rect x="530" y="16" width="120" height="40" rx="4" class="box"/><text x="590" y="41" text-anchor="middle" class="t-bold">Pré-remplissage</text>
