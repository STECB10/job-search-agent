          <line x1="248" y1="90" x2="82" y2="90" class="edge" marker-end="url(#c)"/><text x="165" y="83" text-anchor="middle" class="t-small">fiche + lettre</text>
          <line x1="82" y1="128" x2="248" y2="128" class="edge-hu" marker-end="url(#c-hu)"/><text x="165" y="121" text-anchor="middle" class="t-small hu-text">✅ Valider</text>
          <line x1="248" y1="166" x2="82" y2="166" class="edge" marker-end="url(#c)"/><text x="165" y="159" text-anchor="middle" class="t-small">quel CV ? 🇫🇷 🇬🇧 sans</text>
          <line x1="82" y1="204" x2="248" y2="204" class="edge-hu" marker-end="url(#c-hu)"/><text x="165" y="197" text-anchor="middle" class="t-small hu-text">🇫🇷 CV français</text>
          <line x1="252" y1="242" x2="418" y2="242" class="edge" marker-end="url(#c)"/><text x="335" y="235" text-anchor="middle" class="t-mono">validate(offre, fr)</text>
          <rect x="410" y="258" width="20" height="40" class="box"/><text x="438" y="276" class="t-small">PDF de la lettre</text><text x="438" y="292" class="t-small">gardée comme exemple de style</text>
          <line x1="422" y1="318" x2="928" y2="318" class="edge-off" marker-end="url(#c-off)"/><text x="675" y="311" text-anchor="middle" class="t-small">email CV + lettre, seulement si l'offre donne une adresse</text>
          <line x1="248" y1="356" x2="82" y2="356" class="edge" marker-end="url(#c)"/><text x="165" y="349" text-anchor="middle" class="t-small">PDF, CV, message, lien</text>
          <line x1="82" y1="394" x2="248" y2="394" class="edge-hu" marker-end="url(#c-hu)"/><text x="165" y="387" text-anchor="middle" class="t-small hu-text">🖥️ Pré-remplir</text>
          <line x1="252" y1="432" x2="588" y2="432" class="edge" marker-end="url(#c)"/><text x="420" y="425" text-anchor="middle" class="t-small">lance un processus séparé</text>
          <line x1="592" y1="470" x2="758" y2="470" class="edge-ai" marker-end="url(#c-ai)"/><text x="675" y="463" text-anchor="middle" class="t-small ai-text">questions de l'offre</text>
          <line x1="758" y1="508" x2="592" y2="508" class="edge-ai" marker-end="url(#c-ai)"/><text x="675" y="501" text-anchor="middle" class="t-small ai-text">réponses (JSON)</text>
          <line x1="592" y1="546" x2="928" y2="546" class="edge" marker-end="url(#c)"/><text x="760" y="539" text-anchor="middle" class="t-small">remplit, joint CV + lettre, s'arrête avant « Submit »</text>
          <line x1="588" y1="584" x2="252" y2="584" class="edge" marker-end="url(#c)"/><text x="420" y="577" text-anchor="middle" class="t-small">bilan du formulaire</text>
          <line x1="248" y1="622" x2="82" y2="622" class="edge" marker-end="url(#c)"/><text x="165" y="615" text-anchor="middle" class="t-small">à vérifier · à remplir · à cocher</text>
          <line x1="82" y1="660" x2="928" y2="660" class="edge-hu" marker-end="url(#c-hu)"/><text x="505" y="653" text-anchor="middle" class="t-small hu-text">vous relisez, cochez les consentements, cliquez « Submit »</text>
          <line x1="82" y1="698" x2="248" y2="698" class="edge-hu" marker-end="url(#c-hu)"/><text x="165" y="691" text-anchor="middle" class="t-small hu-text">✔️ J'ai postulé</text>
